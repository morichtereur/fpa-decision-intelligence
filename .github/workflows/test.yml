name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # No API key or source PDFs needed: the extracted facts JSON is
      # committed (small, fully derived), so model/backtest/scenario tests
      # run against it directly. Only the extraction tests need the
      # gitignored source PDFs, and skip gracefully without them.
      # Commentary grounding logic is unit-tested with synthetic text —
      # the live API call itself is never exercised in CI.
      - run: pytest tests/ -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Component tests. Every rendering defect this project has shipped —
      # invisible exposure bars, an empty driver-tree column, a waterfall's
      # closing bar collapsed to nothing, one client's disclaimers under
      # another's name — passed lint, passed the build, passed the whole Python
      # suite, and was caught only by looking at the rendered output. These run
      # in jsdom in about a second.
      - run: npm test
      # NEXT_PUBLIC_API_BASE isn't needed to type-check and build — the
      # cockpit fetches from it at runtime, not at build time.
      - run: npm run build
      - run: npm run typecheck
