# Render blueprint for the API half of the accelerator.
#
# The frontend deploys separately (Vercel, root directory `web/`) and reaches
# this service through NEXT_PUBLIC_API_BASE. Two hosts rather than one because
# each side then runs on its platform's default path — no custom build config
# on either.
#
# The API is stateful in one useful way: forecasts, the Monte Carlo and the
# materiality ranking are cached per client in a long-lived process. A
# serverless deployment would recompute them per invocation. That is the
# reason for a web service here rather than functions.
#
# No LLM key is set. Preset commentary is served from the committed
# data/commentary.json, and /api/commentary/live returns a clear 503 rather
# than exposing a billable endpoint to the open internet. Set ANTHROPIC_API_KEY
# (or BEDROCK_*) in the Render dashboard only if you want live commentary, and
# only with a spend cap on the key.
services:
  - type: web
    name: fpa-decision-intelligence-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: CORS_ORIGINS
        # Set to the Vercel origin once it is assigned. Vercel preview
        # deployments get their own subdomains, which CORS_ORIGIN_REGEX covers.
        value: https://fpa-decision-intelligence.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: ^https://fpa-decision-intelligence-.*\.vercel\.app$
