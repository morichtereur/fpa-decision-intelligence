# adidas AG — the public-data demonstration client.
#
# Everything here comes from adidas's own published annual reports. Nothing
# is invented: where the company does not disclose something, the pack says
# so rather than filling the gap (see drivers.yaml on EBITDA margin and the
# tax rate).

name: "adidas AG"
short_label: "adidas"
data_basis: "Public Data"
is_synthetic: false

industry: "Sporting goods — footwear, apparel and accessories"
currency: "EUR"
currency_symbol: "€"
unit: "millions"

fiscal_year: "FY2025"
baseline_year: "FY2024"

# The management objective this client's decision model is oriented around.
# Free cash flow, because that is where the backtest found the largest and
# most correctable forecast error.
objective: "Free Cash Flow"

# adidas's facts are GENERATED from the annual-report PDFs by src/extract.py,
# unlike the manufacturer's, which are hand-authored and live inside its pack.
# So this points at the extractor's output rather than holding a copy of it.
#
# It held a copy until the FY2023 report was added, at which point the copy
# silently went stale and the pack was serving a facts document with no FY2024
# guidance in it. One generated file, one reader — see
# tests/test_clientpack.py::test_adidas_reads_the_extractors_output_directly.
facts: "../../data/facts/adidas_drivers.json"

# Where the engine finds the two things model.forecast() needs. Naming these
# as paths rather than hardcoding them is what lets a client with different
# segmentation (see manufacturing_demo, which segments by product line)
# use the same engine.
# Which revenue segmentation the model runs on. adidas discloses both a
# product-division and a channel split; the model uses one at a time, and this
# pack chooses product division because it is the one adidas guides against.
# Pointing this at "channel.2024" would run the same engine on the other axis.
segments_path: "product_division.2024"
baseline_group_path: "group.2024"

audiences:
  - "CFO"
  - "FP&A"
  - "Business Owner"

disclaimer: >-
  Built entirely from adidas AG's published annual reports. This is a
  methodology exercise on public disclosures, not investment advice, and not
  affiliated with or endorsed by adidas AG.

has_backtest: true

# Euro bands for High / Medium financial exposure, in the reporting unit.
# adidas FY2025 free cash flow models around EUR 1.07bn on EUR 25.6bn of revenue.
# EUR 150m is roughly 14% of that cash flow -- a number that would change the
# capital allocation conversation. EUR 60m is where it becomes worth a review.
materiality_thresholds:
  high: 150
  medium: 60
  rationale: >-
    EUR 150m is roughly 14% of plan free cash flow — a number that would change the capital allocation conversation. EUR 60m is where it becomes worth a review rather than a note.
